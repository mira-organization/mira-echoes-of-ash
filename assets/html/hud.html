<head>
    <meta name="hud">
    <link rel="stylesheet" href="assets/css/hud.css">
    <title></title>
</head>
<body id="hud">
<div class="header">
    <div id="left-top-con" class="left-top-container">
        <p id="ping">-1ms</p>
    </div>

    <div class="right-top-container">
        <img id="" src="images/icons/inventory.png" alt="">
        <img id="inspector" src="images/icons/console-24.png" alt="">
        <img id="rapier-grid" src="images/icons/stats-24.png" alt="">
        <img id="" src="images/icons/me.png" alt="">
    </div>
</div>

<div class="left-center-container">
    <!-- Ignara -->
    <div class="entry-card">
        <div class="info-container">
            <p class="entry-text">Ignara</p>
            <slider value="100" min="0" max="100" class="hp"></slider>
        </div>
        <img src="images/avatars/ignara_avatar.png" alt="test">
        <div class="slot">
            <p>1</p>
        </div>
    </div>

    <!-- Lira -->
    <div class="entry-card">
        <div class="info-container">
            <p class="entry-text">Lira</p>
            <slider value="66" min="0" max="100" class="hp"></slider>
        </div>
        <img src="images/avatars/lira_avatar.png" alt="test">
        <div class="slot">
            <p>2</p>
        </div>
    </div>
</div>
</body>
