<head>
    <meta name="hud">
    <link rel="stylesheet" href="assets/css/hud.css">
    <title></title>
</head>
<body id="hud">
<div class="right-top-container">
    <button id="inspector"><icon src="images/icons/console-24.png" /></button>
    <button id="rapier-grid"><icon src="images/icons/stats-24.png" /></button>
    <button id="settings"><icon src="images/icons/settings-24.png" /></button>
</div>

<div class="left-center-container">
    <!-- Ignara -->
    <div class="entry-card">
        <div class="info-container">
            <p class="entry-text">Ignara</p>
            <slider value="100" min="0" max="100" class="hp"></slider>
        </div>
        <img src="images/avatars/ignara_avatar.png" alt="test">
        <div class="slot">
            <p>1</p>
        </div>
    </div>

    <!-- Lira -->
    <div class="entry-card">
        <div class="info-container">
            <p class="entry-text">Lira</p>
            <slider value="66" min="0" max="100" class="hp"></slider>
        </div>
        <img src="images/avatars/lira_avatar.png" alt="test">
        <div class="slot">
            <p>2</p>
        </div>
    </div>
</div>
</body>
