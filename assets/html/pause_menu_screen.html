<head>
    <meta name="pause_menu_screen">
    <meta controller="crates/game_ui/src/controller/menu_screen_controller.rs">
    <link rel="stylesheet" href="assets/css/pause_menu_screen.css">
    <title>Title</title>
</head>
<body id="pause_menu_screen">
<div class="menu-container">
    <div class="menu-head">
        <div class="head-overlay">

            <div class="top-info">
                <div class="avatar">
                    <img src="images/avatars/ignara_avatar_front.png" alt="">
                </div>
                <div class="info-text-con">
                    <h3>Development User</h3>
                    <p>Echoes Ash Level 1</p>
                </div>
            </div>

            <div class="level-info">
                <div class="head-line-box">
                    <h4>Account Level 2</h4>
                    <h4>240 / 1200 EXP</h4>
                </div>

                <progressbar
                        value="20.0"
                        max="100.0"
                        min="0.0">

                </progressbar>
            </div>
        </div>
    </div>

    <div class="holder">

        <!-- Quest -->
        <div class="menu-card-great">
            <h3>Quests</h3>
            <img src="images/tabs/quest.png" alt="">
        </div>

        <!-- Inventory -->
        <div class="menu-card">
            <img src="images/icons/inventory.png" alt="" >
            <h3>Inventory</h3>
        </div>

        <!-- Characters -->
        <div class="menu-card">
            <img src="images/icons/me.png" alt="" >
            <h3>Characters</h3>
        </div>

        <!-- Settings -->
        <div class="menu-card" onclick="open_settings">
            <img src="images/icons/settings.png" alt="" >
            <h3>Settings</h3>
        </div>

        <!-- Exit -->
        <div class="menu-card" onclick="exit_game">
            <img src="images/icons/exit.png" alt="" >
            <h3>Exit</h3>
        </div>
    </div>
</div>
</body>
