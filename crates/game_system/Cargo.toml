[package]
name = "game_system"
version = "0.0.1"
edition = "2024"
authors = ["Daniel Ramke <genshin.exepta@outlook.com>"]

[lib]
name = "game_system"
path = "src/lib.rs"

[dependencies.bevy_rapier3d]
version = "0.30.0"
features = [
    "default",
    "simd-nightly",
    "debug-render-3d"
]

[dependencies.serde]
version = "1.0.219"
features = ["derive"]

[dependencies.serde_json]
version = "1.0.140"

[dependencies.toml]
version = "0.8.23"
features = [
    "parse",
    "display"
]

[dependencies.bevy]
version = "0.16.1"
default-features = true
features = [
    "bevy_log",
]

[dependencies.bevy_kira_audio]
version = "0.23.0"
features = ["ogg", "flac", "wav"]
[dependencies]
clap = { version = "4.5.41", features = ["derive"] }